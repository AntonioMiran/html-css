<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>

    <style>

        table {
            border-collapse: collapse;
            padding: 30px;     
        }

        caption {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
            font-weight: bold;
        }

        th, td {
            border: 2px solid black;
            text-align: center;
            padding: 15px;
            width: 300px;
        }
        .cor {
            background-color: rgb(41, 212, 175);
        }

        .cor1 {
            background-color: brown;
        }

    </style>
</head>
<body>

    <table>
        <caption>Filmes Favoritos</caption>

        <thead class="cor">
            <tr>
                <th scope="col">Grupos</th>
                <th scope="col">Nomes</th>
                <th colspan="5" scope="colgroup">Filmes</th>
            </tr>
        </thead>

        <tfoot>
            <tr>
                <th colspan="4" scope="col">Total</th>
                <td>1520</td>
            </tr>
        </tfoot>

        <tbody>
            <tr>
                <th rowspan="3" class="cor1" scope="rowgroup">Mulheres</th>
                <td>Ana Maria Santos</td>
                <td>Allen</td>
                <td>Rambo</td>
                <td>Vingador</td>
            </tr>

            <tr>
                <td>Beatriz Sousa</td>
                <td>Hulk</td>
                <td>Inception</td>
                <td>Batman</td>
            </tr>

            <tr>
                <td>Cláudio Melo</td>
                <td>Oblivion</td>
                <td>Matrix</td>
                <td>Hero</td>
            </tr>

            <tr>
                <th rowspan="4" class="cor1" scope="rowgroup">Homens</th>
            </tr>

            <tr>
                <td>Bruno Mendonça</td>
                <td>intocaveis</td>
                <td>Amnésia</td>
                <td>Gladiador</td>
            </tr>

            <tr>
                <td>Danel Lourenço</td>
                <td>Wall-E</td>
                <td>Oldboy</td>
                <td>Dangal</td>
            </tr>

            <tr>
                <td>Fabiano</td>
                <td>Star Wars V</td>
                <td>Taxi driver</td>
                <td>Toy Story</td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
