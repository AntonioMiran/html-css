<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

    <style>

        table {
            border-collapse: collapse;
        }

        th, td {
            
            border: 1px solid black;
            padding: 10px;
        }

        .cor{
            background-color: brown;
        }

        col.notas {
            background-color: yellowgreen;
        }


    </style>
</head>
<body>

    <table>

        <colgroup>
            <col class="notas">
        </colgroup>


        <thead class="cor">
            <tr>
                <th rowspan="2">Área</th>
                <th rowspan="2">Disciplinas</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2">Média</th>
            </tr>

            <tr>
               <th>Nota 1</th>
               <th>Nota 2</th>
            </tr>
        </thead>
        
        <tbody>
            <tr>
                <th rowspan="4">Exatas</th>
                <td>Matemática</td>
                <td>00.00</td>
                <td>00.00</td>
                <td>00.00</td>
            </tr>

            <tr>
                <td>Física</td>
                <td>00.00</td>
                <td>00.00</td>
                <td>00.00</td>
            </tr>

            <tr>
                <td>Química</td>
                <td>00.00</td>
                <td>00.00</td>
                <td>00.00</td>
            </tr>

            <tr>
                <td>Biolgia</td>
                <td>00.00</td>
                <td>00.00</td>
                <td>00.00</td>
            </tr>

            <tr>
                <th colspan="4" class="cor">Média de exatas</th>
                <td class="cor">0.0</td>
            </tr>

            <tr>
                <th rowspan="2">Humanas</th>
                <td>Historia</td>
                <td>00.00</td>
                <td>00.00</td>
                <td>00.00</td>
            </tr>

            <tr>
                <td>Geografia</td>
                <td>00.00</td>
                <td>00.00</td>
                <td>00.00</td>
            </tr>

            <tr>
                <th colspan="4" class="cor">Medias Humanas</th>
                <td class="cor">0.0</td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
