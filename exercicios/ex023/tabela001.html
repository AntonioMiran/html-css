<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

       table{
        height: 200px;
        width: 400px;
        border-collapse: collapse;
       }

       td,th {
        border: 1px solid black;
        padding: 8px;
        text-align: center;
        vertical-align: middle;
       }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <table>
        <tr>
            <th>Data</th>
            <th>Produto</th>
            <th>Potência</th>
            <th>Unidades</th>
            <th>Receita</th>
        </tr>
        
            <tr>
               <td>janeiro</td>
               <td>Bicicletas</td>
               <td>Elétrica</td>
               <td>476</td>
               <td>751,604</td>
            </tr>

    </table>
    
</body>
</html>
